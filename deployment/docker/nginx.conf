# nginx server block for the ALPR frontend.
#
# Installed as /etc/nginx/conf.d/default.conf, replacing the stock block. It
# does three jobs: serve the compiled SPA, forward API traffic to the backend
# container, and set caching so the browser re-downloads only what changed.
#
# Everything outside the `server { }` block below sits in the `http` context,
# because conf.d/*.conf is included from within `http` in the base image's
# nginx.conf. `upstream`, `map` and `log_format` are only valid there -- nginx
# refuses to start if they are placed inside `server`.

# Named upstream rather than a literal host:port in proxy_pass, so that the
# connection pool below can be attached to it.
upstream alpr_backend {
    server backend:8000;

    # Reuse of idle connections. Without this nginx opens a fresh TCP
    # connection per proxied request, which is pure latency against the
    # NFR-P5 budget of 50 ms API overhead -- and webcam mode issues several
    # requests per second, continuously.
    keepalive 32;
}

# Cache-Control for the compiled bundle, selected by response content type.
#
# Vite emits content-hashed filenames (app.4f3a1b.js): the name changes
# whenever the contents change, so those files can be cached indefinitely.
# index.html is NOT hashed -- it is the document that points at the current
# hashes, so caching it would pin browsers to a stale build after every
# deployment.
#
# Two details that are easy to get wrong:
#
#   * All patterns are REGEX (`~*`), not exact strings. `$sent_http_content_type`
#     carries the charset parameter, so the value is `text/html; charset=utf-8`
#     and an exact `text/html` match would never fire -- silently leaving HTML
#     with no Cache-Control at all.
#   * The default is the EMPTY STRING. nginx omits a header whose value is
#     empty, so proxied API responses get no Cache-Control from nginx and the
#     backend keeps full control over its own caching semantics.
map $sent_http_content_type $alpr_cache_control {
    default                          "";
    ~*^text/html                     "no-cache";
    ~*^text/css                      "public, max-age=31536000, immutable";
    ~*^(application|text)/javascript "public, max-age=31536000, immutable";
    ~*^font/                         "public, max-age=31536000, immutable";
    ~*^image/                        "public, max-age=2592000";
}

# Structured access log carrying the request id, so a single user action can be
# joined across the nginx log and the backend log.
log_format alpr_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"request_id":"$http_x_request_id",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hides the exact nginx version from response headers.
    server_tokens off;

    charset utf-8;

    access_log /var/log/nginx/access.log alpr_json;
    error_log  /var/log/nginx/error.log warn;

    # ---------------------------------------------------------------------
    # Response headers
    # ---------------------------------------------------------------------
    # Declared ONCE, at server level, and deliberately not repeated in any
    # location block. nginx's add_header does not merge across levels: a
    # single add_header inside a location discards every add_header inherited
    # from the server. Keeping the whole set here means it genuinely applies
    # everywhere, which is why Cache-Control is driven by the map above rather
    # than by per-location directives.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $alpr_cache_control always;

    # ---------------------------------------------------------------------
    # Upload limit
    # ---------------------------------------------------------------------
    # Enforced here as well as in the backend (NFR-S3). nginx rejects an
    # oversized body before it is streamed to the application, so an abusive
    # upload costs the proxy a 413 instead of costing the backend memory and
    # disk. Keep this value >= the backend's own limit, otherwise the backend
    # limit becomes unreachable and clients get nginx's terse 413 page in
    # place of the API's structured error response.
    client_max_body_size 200m;
    client_body_timeout 300s;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;             # lets caches store gzipped and plain variants
    gzip_comp_level 6;        # past ~6 the CPU cost outgrows the size gain
    gzip_min_length 1024;     # below ~1 KB framing overhead exceeds the saving
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;
    # JPEG, PNG, WebP, woff2 and MP4 are already compressed; re-compressing
    # them burns CPU for a result that is typically slightly larger.

    # ---------------------------------------------------------------------
    # API reverse proxy
    # ---------------------------------------------------------------------
    # proxy_pass without a trailing path deliberately preserves the full
    # original URI, so /api/v1/detect arrives at the backend as
    # /api/v1/detect. Writing `http://alpr_backend/` instead would strip the
    # /api prefix and silently 404 every route once the backend mounts its
    # router under /api (endpoint layout is settled in Phase 5).
    location /api/ {
        proxy_pass http://alpr_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";   # required for upstream keepalive

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Correlation id for structured logging. Reuses the client's value
        # when present, otherwise the backend mints one, so a single
        # identifier ties the nginx access log to the backend log line for
        # the same request.
        proxy_set_header X-Request-ID      $http_x_request_id;

        # Video jobs are accepted asynchronously and polled for progress
        # (decision AD-02), so no single request should ever run for minutes.
        # The generous read timeout covers upload of a large video plus the
        # synchronous image path, without hanging a browser tab forever.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Streams the request body straight through instead of spooling it to
        # a temp file first: relevant for multi-hundred-megabyte video uploads.
        proxy_request_buffering off;
    }

    # Liveness endpoint, proxied so the whole stack can be probed through the
    # frontend port alone.
    location = /health {
        proxy_pass http://alpr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;              # keeps periodic probes out of the log
    }

    # ---------------------------------------------------------------------
    # Stored media -- uploaded images, cropped plates, rendered videos
    # ---------------------------------------------------------------------
    # The backend mounts its storage directory at /files (StaticFiles in
    # backend/main.py), and the API returns paths like
    # /files/plates/<uuid>-plate-0.jpg. Those paths are outside /api, so
    # without this block they fell through to the SPA fallback below and every
    # request for a plate crop answered with index.html: HTTP 200, content-type
    # text/html, 568 bytes. The browser showed a broken image and "download
    # image" saved an HTML page under a .jpg name -- a failure that reports
    # success at every layer, which is why it survived until someone opened a
    # result in the UI.
    #
    # It worked in development the whole time: vite.config.ts proxies /files
    # too, so only the Docker deployment was affected. Any path the dev proxy
    # forwards needs a matching location here.
    location /files/ {
        proxy_pass http://alpr_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stored media is immutable: the filename carries a UUID, so a given
        # URL always names the same bytes and can be cached hard. This matters
        # for the history table, which requests dozens of thumbnails per page.
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;

        # A rendered video can be large; allow it to stream rather than
        # spooling the whole response before the first byte reaches the client.
        proxy_buffering off;
    }

    # Swagger / ReDoc / raw schema. Exposed through the frontend origin so the
    # API documentation deliverable is reachable at the same host:port as the
    # UI. Drop this block if the stack is ever published on a public network.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://alpr_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------
    # Vite writes hashed bundles here. `try_files ... =404` stops a missing
    # asset from falling through to index.html, which would otherwise return
    # HTML with a 200 status where JavaScript was expected -- a confusing
    # failure that surfaces as a MIME type error in the browser console.
    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # SPA history fallback
    # ---------------------------------------------------------------------
    # React Router owns the client-side routes, so a hard reload of, say,
    # /history must still return index.html and let the router resolve the
    # path. Without this, any URL other than / returns 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
