# Alembic configuration for the ALPR backend.
#
# The database URL is deliberately NOT set here. It is read from
# backend.core.config.Settings inside migrations/env.py, so that the migration
# tool and the running server can never be pointed at two different databases
# (NFR-M4). Setting sqlalchemy.url below would create exactly that split: the
# server would follow ALPR_DATABASE_URL and Alembic would follow this file, and
# "the migration ran but the table is missing" would be the symptom.
#
# Usage, from the repository root:
#   alembic -c backend/alembic.ini upgrade head
#   alembic -c backend/alembic.ini revision --autogenerate -m "add something"
#   alembic -c backend/alembic.ini downgrade -1

[alembic]
# %(here)s expands to the directory containing this file, so the migrations are
# found whether alembic is invoked from the repository root, from backend/, or
# from inside the Docker image where the checkout lives at a different path.
script_location = %(here)s/migrations

# Put the repository root on sys.path so `import backend` works in env.py
# regardless of the working directory. Without this, running alembic from
# anywhere other than the root fails with ModuleNotFoundError: backend.
prepend_sys_path = %(here)s/..

# Revision filenames get a UTC timestamp prefix, so `ls versions/` shows the
# migration order. Without it the files sort by random hash and the sequence is
# only discoverable by reading down_revision in each one.
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(slug)s
timezone = UTC

# Path separator for version_locations; os means "use the platform default",
# which keeps this file working on both Windows and the Linux container.
path_separator = os

# sqlalchemy.url is intentionally absent -- see the note at the top of the file.

[post_write_hooks]
# No formatting hooks. Generated migrations are reviewed and edited by hand
# before being committed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Set to INFO to echo the SQL each migration emits, which is the quickest way
# to see what a batch-mode SQLite migration actually did.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
