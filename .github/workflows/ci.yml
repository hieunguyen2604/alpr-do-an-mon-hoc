name: CI

# Cổng chất lượng tối thiểu — đề xuất từ NFR-M6 trong 07-testing-report.md.
# Hai lớp: (1) cổng tài liệu rẻ và tất định, chặn tham chiếu chết và số liệu
# vòng đo đã bị thay thế; (2) bộ test đầy đủ — nặng cài đặt, tạm
# continue-on-error cho tới lần chạy xanh đầu tiên rồi bỏ dòng đó đi.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-gate:
    name: Tài liệu — tham chiếu & số liệu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Kiểm tra tham chiếu quyển ĐATN
        run: python scripts/check_thesis_refs.py

      - name: Kiểm tra tham chiếu quyển môn học
        run: python scripts/check_thesis_refs.py mon-hoc

      - name: Quét số vòng đo đã bị thay thế trong slide
        # Hai mức, vì không phải tệp nào trong docs/slides/ cũng có cùng nhiệm vụ.
        #
        # Mức 1 — cấm ở MỌI tệp slide: các con số đã bị rút hẳn, không còn ngữ
        # cảnh nào khiến chúng đúng.
        #
        # Mức 2 — chỉ cấm trên BA DECK CHIẾU, miễn trừ 10-defense-qa.md: con số
        # cũ bị bác bỏ mà bộ Hỏi–Đáp có nhiệm vụ *giải thích*. Cấm nó ở đó là
        # cấm đúng thứ cần có — hội đồng hỏi "sao khác con số cũ?" thì phải trả
        # lời được. Deck chiếu thì khác: nó chỉ hiển thị kết luận, không kể sử.
        #
        # KHÔNG cấm: "9.126 cặp" (hợp lệ khi kể lịch sử rò rỉ v2), và KHÔNG cấm
        # 57,27 / 108,28 / 168,41 ms — ba số này là SỐ HIỆN HÀNH của bảng phân rã
        # độ trễ (ch5 Bảng 5.10, bản môn học Bảng 4.10), không phải số đã thay.
        run: |
          set -e
          MOI_NOI='25,[45] điểm|25\.45|0,700\)|1\.000 test|94,54% từng|69,96%|triệt hạ hoàn toàn'
          CHI_DECK='2,379 FPS'
          FAIL=0

          HITS=$(grep -rnE "$MOI_NOI" docs/slides/*.md || true)
          if [ -n "$HITS" ]; then
            echo "::error::Số liệu đã bị rút xuất hiện trong slide:"
            echo "$HITS"
            FAIL=1
          fi

          HITS=$(grep -rnE "$CHI_DECK" \
            docs/slides/10-slides.md \
            docs/slides/11-slides-ky-thuat.md \
            docs/slides/12-slides-mon-hoc.md || true)
          if [ -n "$HITS" ]; then
            echo "::error::Số cũ xuất hiện trên deck chiếu (được phép trong 10-defense-qa.md, nơi giải thích nó):"
            echo "$HITS"
            FAIL=1
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "Slide sạch số cũ."

  tests:
    name: Bộ kiểm thử đầy đủ
    runs-on: ubuntu-latest
    # TODO: sau lần chạy xanh đầu tiên, xóa dòng `continue-on-error` để biến
    # job này thành cổng bắt buộc.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Thư viện hệ thống cho OpenCV
        # `opencv-python` (bản không headless) liên kết tới libGL, mà runner
        # ubuntu-latest không cài sẵn — thiếu nó thì `import cv2` chết ngay với
        # "libGL.so.1: cannot open shared object file".
        #
        # Ba mô-đun `ai/inference/{two_line,plate_color,superres}.py` import cv2
        # ở CẤP MODULE, và 13 tệp test chạm tới tầng AI, nên lỗi này chặn gần
        # như toàn bộ bộ kiểm thử chứ không riêng vài ca.
        #
        # Cài thư viện hệ thống thay vì đổi sang `opencv-python-headless`: CI
        # phải chạy đúng gói mà bản giao hàng dùng, nếu không thì lại rơi vào
        # đúng cái bẫy "công cụ đo lệch khỏi đường xử lý thật" mà đồ án đã trả
        # giá bốn lần.
        #
        # Tên gói glib đổi giữa các bản Ubuntu (24.04 dùng hậu tố `t64`), nên
        # thử bản mới trước rồi lùi về tên cũ.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Cài phụ thuộc tầng AI (torch CPU)
        run: |
          grep -vE '^\s*(torch==|torchvision==)' ai/requirements.txt > /tmp/ai-req.txt || true
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu torchvision==0.28.0+cpu
          python -m pip install -r /tmp/ai-req.txt

      - name: Cài phụ thuộc backend
        run: |
          python -m pip install -r backend/requirements.txt
          [ -f backend/requirements-inference.txt ] && python -m pip install -r backend/requirements-inference.txt || true
          python -m pip install pytest pytest-cov

      - name: Chạy toàn bộ kiểm thử
        run: python -m pytest -q
