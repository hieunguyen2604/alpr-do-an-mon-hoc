; Pytest configuration for the Vietnamese ALPR project.
;
; Coverage is measured over the two business-logic packages only -- ``ai`` and
; ``backend``. Test code, migrations and the virtual environments are excluded:
; counting the test files themselves would inflate the figure that NFR-M2 puts a
; floor under, which is precisely the number the report has to be able to trust.
;
; Run the full measured suite with:
;   pytest --cov=ai --cov=backend --cov-report=term --cov-report=html

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    slow: tests that take noticeably longer than a unit test
    integration: exercises several layers together through the HTTP API

filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:google.protobuf.*
